$kind: collection
description: |-
  Money transfer API (Clean Architecture, CQRS, MediatR, EF Core, HttpClient).

  Before running:

  1. Start MockBank.Api ([http://localhost:5100](http://localhost:5100))
      
  2. Start the API and set the baseUrl variable to its port
      

  Mock Bank magic amounts:

  - normal amount -> Success (code 00)
      
  - 400 -> Bank 400
      
  - 500 -> Bank 500
      
  - 999 -> Timeout
      
  - > 10000 -> Business Error (code 51) 
        
      
  - Mock Bank stopped -> Connection Error
variables:
  baseUrl: http://localhost:5000
  transferId: "1"
